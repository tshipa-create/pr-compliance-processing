[project]
name = "pr-compliance"
version = "1.0.0"
description = "GitHub pull-request compliance pipeline (extract -> transform -> load) for Apache Airflow 3.3"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
# Runtime deps. Versions are bounded loosely here and pinned exactly by Airflow's
# constraints file (see [tool.uv] below and the infra Dockerfile), so the package
# always resolves to what the apache/airflow:3.3.0 image ships.
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "pandas>=2.1",
    "pyarrow>=16",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandera>=0.22",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "responses>=0.25",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "types-requests",
    "types-jsonschema",
    "types-psycopg2",
    "pip-audit>=2.7",
]
# Airflow itself is provided by the Docker image. It is only installed for the DAG
# import test (Linux/CI); it is not a runtime dependency of the package.
airflow = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-postgres",
    "apache-airflow-providers-smtp",
]

[tool.uv]
default-groups = ["dev"]
# Mirror the pins from https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.13.txt
# for every library that is shared with the Airflow image.
constraint-dependencies = [
    "requests==2.34.2",
    "tenacity==9.1.4",
    "pandas==2.3.3",
    "numpy==2.5.0",
    "pyarrow==24.0.0",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "psycopg2-binary==2.9.12",
    "SQLAlchemy==2.0.51",
    "pendulum==3.2.0",
    "apache-airflow-providers-postgres==6.8.0",
    "apache-airflow-providers-smtp==3.0.1",
    "apache-airflow-providers-common-sql==2.0.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_compliance"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PTH", "TRY", "LOG"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "TRY003", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PLC0415", "TRY301"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["pr_compliance"]

[[tool.mypy.overrides]]
module = ["pandera.*", "airflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real Postgres (COMPLIANCE_DB_URL)",
    "airflow: needs apache-airflow installed (DAG import test)",
]

[tool.coverage.run]
source = ["pr_compliance"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
