name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube needs full history
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13" # matches the apache/airflow:3.3.0 image
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov --cov-report=xml --cov-report=term
      - run: uv run pip-audit --strict --progress-spinner off --skip-editable
      - name: SonarQube Cloud quality gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration:
    name: integration tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: compliance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -m integration -v
        env:
          COMPLIANCE_DB_URL: postgresql://postgres:test@localhost:5432/compliance

  dag:
    name: DAG integrity (inside apache/airflow:3.3.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package into the official image and import the DAG
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint bash apache/airflow:3.3.0 -c '
            curl -sSfL -o /tmp/c.txt https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.13.txt &&
            uv pip install -q -c /tmp/c.txt . pytest responses freezegun &&
            airflow db migrate > /dev/null &&
            python -m pytest tests/test_dag.py -v -p no:cacheprovider'

  release:
    name: build wheel and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, integration, dag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
